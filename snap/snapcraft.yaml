name: simpletskmgr
title: SimpleTskMgr
base: core24
adopt-info: simpletskmgr          # version is read from simpletskmgr.py
summary: Simple, modern terminal task manager with ring gauges
description: |
  SimpleTskMgr is a minimal task manager for the Linux terminal: a clean
  monochrome interface with colored ring gauges for CPU, GPU and memory.

  * Ring gauges for CPU, GPU and RAM usage
  * Per-core CPU bars, swap, VRAM, NPU, network and disk throughput
  * Disk usage for all mounted filesystems
  * Process list with readable app names, live search, sorting
  * Terminate or kill processes

  Some features need extra permissions that are not connected automatically:

      sudo snap connect simpletskmgr:hardware-observe   # GPU / NPU / temperatures
      sudo snap connect simpletskmgr:mount-observe      # disk usage
      sudo snap connect simpletskmgr:process-control    # kill processes
grade: stable
confinement: strict
license: MIT
icon: data/simpletskmgr.png
website: https://github.com/RealCat1st/simpletskmgr
source-code: https://github.com/RealCat1st/simpletskmgr
issues: https://github.com/RealCat1st/simpletskmgr/issues

apps:
  simpletskmgr:
    command: bin/simpletskmgr
    environment:
      TERMINFO_DIRS: $SNAP/usr/share/terminfo:$SNAP/lib/terminfo
      PYTHONDONTWRITEBYTECODE: "1"
    plugs:
      - system-observe     # see all processes, CPU, memory
      - hardware-observe   # GPU / NPU / sensors in /sys
      - mount-observe      # list mounted filesystems
      - process-control    # send signals to other processes
      - network            # (reserved) network statistics

parts:
  simpletskmgr:
    plugin: dump
    source: .
    stage-packages:
      - python3-minimal
      - libpython3-stdlib    # includes the curses module
      - ncurses-base
      - ncurses-term         # terminfo for kitty, alacritty, foot, ...
    override-build: |
      install -Dm755 simpletskmgr.py "$CRAFT_PART_INSTALL/bin/simpletskmgr"
      craftctl set version="$(sed -n 's/^VERSION = "\(.*\)"/\1/p' simpletskmgr.py)"
